<ngx-charts-chart [view]="[width, height]" [showLegend]="false" [animations]="animations">
  <svg:g class="linear-gauge chart">
    <svg:g ngx-charts-bar class="background-bar" [width]="dims.width" [height]="3" [x]="margin[3]"
      [y]="dims.height / 2 + margin[0] - 2" [data]="{ value: 0, name: '' }"
      [orientation]="barOrientation.Horizontal" [roundEdges]="true" [animations]="animations">
    </svg:g>
    <svg:g *ngIf="hasProjectedValue" ngx-charts-bar [width]="valueScale(min+ barValue)" [height]="3"
      [x]="margin[3]" [attr.transform]="transformBar" [y]="dims.height / 2 + margin[0] - 2"
      [fill]="colors!.getColor(units)" [data]="{ value: 0, name: '' }"
      [orientation]="barOrientation.Horizontal" [roundEdges]="true" [animations]="animations">
    </svg:g>

    <svg:line [attr.transform]="transformLine" x1="0" y1="5" x2="0" y2="15"
      [attr.stroke]="colors?.getColor(units)" />

    <svg:line [attr.transform]="transformLine" x1="0" y1="-5" x2="0" y2="-15"
      [attr.stroke]="colors?.getColor(units)" />

    <svg:g [attr.transform]="transform">
      <svg:g [attr.transform]="valueTranslate">
        <svg:text #valueTextEl class="value" [style.textAnchor]="'middle'"
          [attr.transform]="valueTextTransform" alignment-baseline="after-edge">
          {{ displayValue + ' ' + (units | translate) }}
        </svg:text>
      </svg:g>

      <svg:g [attr.transform]="unitsTranslate">
        <svg:text #unitsTextEl class="units" [style.textAnchor]="'middle'"
          [matTooltip]="('tooltip.'+label) | translate" matTooltipShowDelay="500" [matTooltipDisabled]="hideTooltip"
          [attr.transform]="unitsTextTransform" alignment-baseline="before-edge">
          {{ label | translate }}
        </svg:text>
      </svg:g>
    </svg:g>
  </svg:g>
</ngx-charts-chart>
