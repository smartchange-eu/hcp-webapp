<div class="main mt-4 d-flex flex-column flex-justify-stretch p-4">
  <!--
    -
    -->
  <div class="d-flex flex-justify-center">
    <img class="col-6 col-md-3 m-md-3 col-lg-2" src="assets/images/SC-logo.png">
  </div>

  <mat-card appearance="outlined" class="card offset-1 col-10 offset-md-3 col-md-6 p-md-0 offset-lg-4 col-lg-4 p-5 mt-3">
    <mat-card-title class="m-3">{{'unauthorized.title' | translate}}</mat-card-title>

    <mat-card-content>
      <div class="card-content mt-4 mb-4">
        <p class="details">{{'unauthorized.content' | translate}}</p>
      </div>
    </mat-card-content>

    <mat-card-actions class="d-flex flex-justify-center">
      <button mat-raised-button color="primary" (click)="navigateToAuth()">{{'ok.label' | translate}}</button>
    </mat-card-actions>
  </mat-card>
</div>
