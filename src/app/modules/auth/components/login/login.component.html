<div class="main">
  <form [formGroup]="loginForm" novalidate (ngSubmit)="onSubmit()">
    <mat-card appearance="outlined" class="main-card">
      <mat-card-header>
        <mat-card-title>{{'basic.login.card.label' | translate}}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="card-content">
        <p>{{'login.welcome' | translate}}</p>
          <mat-form-field>
            <input matInput placeholder="First name" formControlName="username">
            <mat-error *ngIf="loginForm.controls['username'].hasError('required')" [innerHTML]="'required.label' | translate">
            </mat-error>
          </mat-form-field>
          <mat-form-field>
            <input type="password" matInput placeholder="Last name" formControlName="password">
            <mat-error *ngIf="loginForm.controls['password'].hasError('required')" [innerHTML]="'required.label' | translate">
            </mat-error>
          </mat-form-field>
        </div>
      </mat-card-content>
      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit">{{'basic.login.button.label' | translate}}</button>
      </mat-card-actions>
      </mat-card>
      </form>
</div>
