<mat-progress-bar *ngIf="loading || enahncing" mode="query"></mat-progress-bar>
<div class="d-flex flex-column flex-items-center m-3">
  <mat-card class="col-12 m-3">
    <mat-card-header class="p-3">
      <mat-card-title> {{ "title.add-patient" | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="d-flex flex-row flex-justify-between">
        <label>{{ "card.add-patient.content" | translate }}</label>
        <button mat-fab extended color="primary" [routerLink]="'../add-student'">
          <mat-icon>person_add</mat-icon>
          {{ "card.add-patient.button" | translate }}
        </button>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="!loading" class="col-12 m-3">
    <mat-card-header class="p-3">
      <mat-card-title color="accent">
        {{ "title.student-list" | translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <heart-trial-patient-list [lang]="lang" [patients]="patientsList"
        [displayedColumns]="pat_columns" [enableRefreshButton]="false" [expand]="true"
        [pageSize]="25" [actions]="actions" (askEdit)="performAction($event)">
      </heart-trial-patient-list>
    </mat-card-content>
  </mat-card>
</div>
