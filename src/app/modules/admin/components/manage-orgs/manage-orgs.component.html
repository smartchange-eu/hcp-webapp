<mat-progress-bar *ngIf="loading" mode="query"></mat-progress-bar>
<div class="d-flex flex-column flex-gap-2 m-3">
  <mat-card class="col-12 col-lg-6">
    <mat-card-header class="p-3">
      <mat-card-title> {{"title.add-org"| translate }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="d-flex flex-row flex-justify-between">
        <label>{{"organization-add.button.label" | translate}}</label>
        <button mat-fab extended color="primary" (click)="openAddDialog()">
          <mat-icon>add</mat-icon>
          {{ 'card.add-hcp.button' | translate }}
        </button>
      </div>
    </mat-card-content>
  </mat-card>
  <mat-card *ngIf="!loading" class="col-12">
    <mat-card-header class="p-3">
      <mat-card-title color="accent"> {{"title.orgs-list"| translate }}</mat-card-title>
    </mat-card-header>
    <div class="d-flex p-3">
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

        <!--- Note that these columns can be defined in any order.
              The actual rendered columns are set as a property on the row definition" -->

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> {{ 'org-table.name.label' | translate }} </th>
          <td mat-cell *matCellDef="let element"> {{element.name}} </td>
        </ng-container>
        <!-- Symbol Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> {{ 'org.table.actions.label' | translate }} </th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button (click)="doEditOrg(element)">
              <mat-icon>edit</mat-icon>
            </button>
            <!-- <button mat-icon-button color="warn" (click)="doDeleteOrg(element)">
              <mat-icon>delete</mat-icon>
            </button> -->
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <!-- <mat-list>
        <mat-list-item *ngFor="let organization of organizations">
          {{ organization.name }}
        </mat-list-item>
      </mat-list> -->

  </mat-card>
</div>
