<div class="chart-container">
  <svg [attr.width]="view[0]" [attr.height]="view[1]" class="chart">
    <defs>
      <!-- Gradient definitions if needed -->
      <linearGradient *ngIf="gradient" id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" [attr.stop-color]="scheme.domain[0]" stop-opacity="0.8" />
        <stop offset="100%" [attr.stop-color]="scheme.domain[0]" stop-opacity="0.3" />
      </linearGradient>
    </defs>

    <!-- Main chart group with margins -->
    <g [attr.transform]="'translate(60, 10)'">
      <!-- Grid lines -->
      <g *ngIf="showGridLines" class="grid-lines">
        <!-- Horizontal grid lines -->
        <g *ngFor="let tick of yScale.ticks(5)">
          <line [attr.x1]="0" [attr.x2]="dims.width" [attr.y1]="yScale(tick)"
            [attr.y2]="yScale(tick)" stroke="#e0e0e0" stroke-width="1" stroke-dasharray="2,4">
          </line>
        </g>

        <!-- Vertical grid lines -->
        <g *ngFor="let item of results">
          <line [attr.x1]="xScale(item.name) + xScale.bandwidth() / 2"
            [attr.x2]="xScale(item.name) + xScale.bandwidth() / 2" [attr.y1]="0"
            [attr.y2]="dims.height" stroke="#f0f0f0" stroke-width="1"></line>
        </g>
      </g>

      <!-- Bar chart -->
      <g class="bar-chart">
        <rect *ngFor="let item of results; trackBy: trackBy" [attr.x]="xScale(item.name)"
          [attr.y]="yScale(item.value)" [attr.width]="xScale.bandwidth()"
          [attr.height]="dims.height - yScale(item.value)"
          [attr.fill]="gradient ? 'url(#barGradient)' : scheme.domain[0]"
          [attr.opacity]="noBarWhenZero && item.value === 0 ? 0 : 1" class="bar"
          style="cursor: pointer">
          <!-- Tooltip on hover -->
          <title *ngIf="!tooltipDisabled">
            {{ item.name }}: {{ item.value }}
          </title>
        </rect>
      </g>

      <!-- Line charts -->
      <g class="line-chart" *ngIf="lineChart && lineChart.length > 0">
        <g *ngFor="let lineSeriesData of lineChart; let seriesIndex = index">
          <!-- Line path with dashed style -->
          <path [attr.d]="getLinePath(lineSeriesData.series)"
            [attr.stroke]="colorSchemeLine.domain[seriesIndex] || '#666'" stroke-width="2"
            fill="none" stroke-dasharray="5,5" stroke-linecap="round"></path>
        </g>
      </g>

      <!-- X-axis -->
      <g *ngIf="xAxis" class="x-axis" [attr.transform]="'translate(0, ' + dims.height + ')'">
        <line [attr.x1]="0" [attr.x2]="dims.width" y1="0" y2="0" stroke="#666"></line>

        <g *ngFor="let item of results; let i = index">
          <line [attr.x1]="xScale(item.name) + xScale.bandwidth() / 2"
            [attr.x2]="xScale(item.name) + xScale.bandwidth() / 2" y1="0" y2="5" stroke="#666">
          </line>

          <!-- Smart label display - only show some labels to avoid cramping -->
          <text *ngIf="shouldShowDateLabel(i) || i === results.length - 1"
            [attr.x]="xScale(item.name) + xScale.bandwidth() / 2" y="18" text-anchor="middle"
            font-size="10" fill="#666">
            {{ item.name }}
          </text>
        </g>

        <!-- X-axis label -->
        <text *ngIf="showXAxisLabel && xAxisLabel" [attr.x]="dims.width / 2" y="50"
          text-anchor="middle" font-size="14" fill="#333">
          {{ xAxisLabel }}
        </text>
      </g>

      <!-- Y-axis -->
      <g *ngIf="yAxis" class="y-axis">
        <line x1="0" x2="0" [attr.y1]="0" [attr.y2]="dims.height" stroke="#666"></line>
        <g *ngFor="let tick of yScale.ticks(5)">
          <!-- Tick marks -->
          <line x1="-5" x2="0" [attr.y1]="yScale(tick)" [attr.y2]="yScale(tick)" stroke="#666">
          </line>
          <!-- Labels -->
          <text x="-8" [attr.y]="yScale(tick)" text-anchor="end" dominant-baseline="middle"
            font-size="12" fill="#666">
            {{ tick }}
          </text>
        </g>

        <!-- Y-axis label -->
        <text *ngIf="showYAxisLabel && yAxisLabel" x="-40" [attr.y]="dims.height / 2"
          text-anchor="middle" font-size="14" fill="#333"
          [attr.transform]="'rotate(-90, -40, ' + dims.height / 2 + ')'">
          {{ yAxisLabel }}
        </text>
      </g>
    </g>
